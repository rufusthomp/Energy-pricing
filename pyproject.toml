[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbmo"
version = "0.2.0"
description = "GB electricity merit-order analyser: reconstructs the supply stack and the price-setting fuel from half-hourly generation, demand and wholesale-price data."
requires-python = ">=3.11"

# Pinned to the versions the project was built and verified against. Transitive
# dependencies are left to the resolver: this is an application run from a fresh venv,
# not a library, and over-pinning the whole tree makes upgrades harder than it makes
# builds reproducible.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "requests==2.32.3",
    "openpyxl==3.1.5",  # QEP 3.2.1 workbook is .xlsx; pandas.read_excel needs this engine
    "scipy==1.15.3",       # HiGHS solver for the arbitrage LP
    "scikit-learn==1.6.1",  # HistGradientBoostingRegressor, the day-ahead price forecaster
    # The database layer. Undeclared from the Postgres migration until 2026-09-05: every
    # local environment already had them via Anaconda, and no test imported a module that
    # needed them, so a fresh clone could not have run the ETL or the migrations. That is
    # what tests/test_imports.py now exists to catch.
    "SQLAlchemy==2.0.39",
    "psycopg[binary]==3.3.5",  # the driver behind postgresql+psycopg:// in config.py
    "alembic==1.19.1",         # migrations are part of standing the project up, not tooling
    # ENTSO-E publishes nested position-indexed XML with per-document resolutions and
    # per-zone clocks. Reimplementing that parser would be a week of work with no
    # analytical payoff, and this client is the one the field actually uses.
    "entsoe-py==0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.16.5",
]

[project.scripts]
gbmo-load = "gbmo.ingest.load:main"
gbmo-sources = "gbmo.ingest.sources:main"
gbmo-entsoe = "gbmo.ingest.entsoe:main"
gbmo-load-zones = "gbmo.ingest.load_zones:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
