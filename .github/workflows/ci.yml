name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the declared requires-python; upper is what the project is
        # developed against. Catches accidental use of newer syntax.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      # The ETL itself is not exercised here: the raw inputs are gitignored (a 61 MB
      # generation CSV plus 18 demand files), so there is nothing for CI to load. The
      # tests cover the transforms that carry the modelling logic; end-to-end equivalence
      # is verified locally against a known-good database.
