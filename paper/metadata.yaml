---
title: "More Value, Not More Information"
subtitle: "Wind, Solar and the Returns to Electricity Storage Arbitrage in Europe"
author:
  - Rufus Thompson
date: "Working paper, revised September 2026"
abstract: |
  Grid-scale storage in Europe is financed on the expectation that renewables create
  arbitrage value. We ask whether they do, and whether that value can be captured
  without forecasting. Using hourly day-ahead prices for 18 European bidding zones from
  2019 to 2026, we operate a price-taking battery four ways that differ only in
  information: perfect foresight, a typical-day schedule learned from the previous four
  weeks, persistence, and a forecaster built on TSO day-ahead fundamentals. The treatments
  are daily forecast wind and solar penetration, under zone-by-year, zone-by-month and
  date fixed effects. Solar creates arbitrage value: 10 percentage points more forecast
  solar raises a day's perfect-foresight value by 28%. Wind creates none. Solar also moves
  the day's price peak and trough towards the hours the calendar predicts. But neither
  technology changes the value that requires information. The calendar operator's euro
  shortfall does not respond to either, and a forecaster's advantage over it falls on
  windy days. Our pre-registered test, that calendar operators capture a larger share of
  solar-driven than wind-driven value, has the predicted sign but is inconclusive
  (wild-bootstrap p = 0.12). A registered result that wind's cost grows with a system's
  wind share rests on a single zone. The renewable mix changes how much day-ahead storage
  value there is, not who can capture it. Hypotheses were pre-registered; analyses added
  after the first results, including in response to review, are reported as
  exploratory.
keywords: [energy storage, arbitrage, wind, solar, value of information, day-ahead markets]
